<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kitchen Together</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Kitchen Together</h1>
        <p>Your shared kitchen, made easier.</p>
    </header>

    <main>

        <section class="welcome">
            <h2>Good evening 👋</h2>
            <p>What shall we cook today?</p>
        </section>

        <section class="cards">

            <div class="card">
    <span class="icon">🥫</span>
    <h3>Our Kitchen</h3>

    <input
        type="text"
        id="ingredientInput"
        placeholder="Ingredient"
    >

    <input
        type="number"
        id="quantityInput"
        placeholder="Quantity"
        min="1"
    >

    <input
        type="text"
        id="unitInput"
        placeholder="Unit (e.g. pieces)"
    >

    <button onclick="addIngredient()">Add</button>

    <ul id="ingredientList"></ul>
</div>
                <button>View Kitchen</button>
            </div>

            <div class="card">
                <span class="icon">🍳</span>
                <h3>What Can We Cook?</h3>
                <p>7 meals available</p>
                <button onclick="sayHello()">Find Meals</button>
            </div>

            <div class="card">
                <span class="icon">🛒</span>
                <h3>Shopping List</h3>
                <p>5 items</p>
                <button>View List</button>
            </div>

            <div class="card">
                <span class="icon">💰</span>
                <h3>Save Money</h3>
                <p>Compare your basket</p>
                <button>Compare Prices</button>
            </div>

        </section>

    </main>
    <script src="app.js"></script>

</body>

</html>
